name: Build and deploy Docker image to Azure App Service (Container)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest

      - name: Set App Service container image
        uses: azure/cli@v1
        with:
          inlineScript: |
            az webapp config container set \
              --name ${{ secrets.WEBAPP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --docker-custom-image-name ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest \
              --docker-registry-server-url https://${{ secrets.REGISTRY }}

      - name: Restart Web App
        uses: azure/cli@v1
        with:
          inlineScript: |
            az webapp restart --name ${{ secrets.WEBAPP_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }}
